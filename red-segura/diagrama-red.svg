<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="vpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Red segmentada Act4 — 3 VLAN + VPN IPsec (mínimo privilegio)</text>
  <text x="700" y="64" text-anchor="middle" font-size="15" fill="#4b5563">Packet Tracer: R-ISP (2911) · R-EDGE (2911 securityk9) · SW-CORE (2960) · en el entorno virtual, pfSense + Snort ocupan el lugar de R-EDGE</text>

  <!-- Internet -->
  <ellipse cx="700" cy="140" rx="170" ry="52" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#3730a3">Internet</text>
  <text x="700" y="156" text-anchor="middle" font-size="13" fill="#3730a3">R-ISP 200.10.10.1 / 198.51.100.1</text>

  <!-- Remote user -->
  <rect x="1060" y="100" width="260" height="84" rx="10" fill="#f5f3ff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="1190" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">PC-REMOTO (teletrabajo)</text>
  <text x="1190" y="149" text-anchor="middle" font-size="13" fill="#4a148c">198.51.100.10 → pool 10.10.50.0/24</text>
  <text x="1190" y="168" text-anchor="middle" font-size="13" fill="#4a148c">Cliente Easy VPN / IKEv2</text>
  <line x1="1060" y1="142" x2="872" y2="142" stroke="#374151" stroke-width="2"/>

  <!-- Attacker -->
  <rect x="80" y="100" width="250" height="84" rx="10" fill="#fff1f2" stroke="#c62828" stroke-width="2"/>
  <text x="205" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">Atacante externo</text>
  <text x="205" y="149" text-anchor="middle" font-size="13" fill="#b71c1c">nmap -sS / -sX / NSE</text>
  <text x="205" y="168" text-anchor="middle" font-size="13" fill="#b71c1c">solo ve 443 + IKE/ESP</text>
  <line x1="330" y1="142" x2="528" y2="142" stroke="#374151" stroke-width="2"/>

  <!-- Edge -->
  <line x1="700" y1="192" x2="700" y2="250" stroke="#374151" stroke-width="3"/>
  <text x="712" y="226" font-size="13" fill="#374151">WAN 200.10.10.0/30</text>
  <rect x="470" y="250" width="460" height="132" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="700" y="279" text-anchor="middle" font-size="19" font-weight="bold" fill="#9a3412">R-EDGE / pfSense — perímetro</text>
  <text x="700" y="303" text-anchor="middle" font-size="13.5" fill="#7c2d12">Inter-VLAN (Gi0/1.10 · .20 · .30 · .99) · ACL de entrada por VLAN</text>
  <text x="700" y="323" text-anchor="middle" font-size="13.5" fill="#7c2d12">NAT: PAT + 200.10.10.2:443 → SRV-WEB · SSH solo PC-ADMIN/VPN</text>
  <text x="700" y="343" text-anchor="middle" font-size="13.5" fill="#7c2d12">IPsec AES-256 / SHA · Snort IDS/IPS (WAN + DMZ)</text>
  <text x="700" y="363" text-anchor="middle" font-size="13.5" fill="#7c2d12">pfBlockerNG DNSBL: bloqueo de dominios de phishing</text>

  <!-- VPN tunnel -->
  <path d="M1190,184 C1190,300 1060,316 932,316" fill="none" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#vpn)"/>
  <text x="1212" y="232" font-size="14" font-weight="bold" fill="#6a1b9a">Túnel IPsec</text>
  <text x="1212" y="250" font-size="12.5" fill="#6a1b9a">split tunnel: DMZ + INTERNA</text>
  <text x="1212" y="266" font-size="12.5" fill="#6a1b9a">IoT y GESTIÓN denegados</text>

  <!-- Switch -->
  <line x1="700" y1="382" x2="700" y2="440" stroke="#374151" stroke-width="3"/>
  <text x="712" y="416" font-size="13" fill="#374151">Troncal 802.1Q · permitidas 10,20,30,99 · nativa 99</text>
  <rect x="490" y="440" width="420" height="84" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2.5"/>
  <text x="700" y="468" text-anchor="middle" font-size="18" font-weight="bold" fill="#075985">SW-CORE (2960)</text>
  <text x="700" y="490" text-anchor="middle" font-size="13" fill="#075985">port-security sticky · BPDU guard · DHCP snooping</text>
  <text x="700" y="509" text-anchor="middle" font-size="13" fill="#075985">puertos sin uso → VLAN 999 shutdown · gestión 172.16.99.2</text>

  <!-- trunks to zones -->
  <line x1="560" y1="524" x2="230" y2="600" stroke="#374151" stroke-width="2.5"/>
  <line x1="700" y1="524" x2="700" y2="600" stroke="#374151" stroke-width="2.5"/>
  <line x1="840" y1="524" x2="1170" y2="600" stroke="#374151" stroke-width="2.5"/>

  <!-- DMZ -->
  <rect x="40" y="600" width="380" height="250" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="230" y="632" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400e">VLAN 10 · DMZ</text>
  <text x="230" y="654" text-anchor="middle" font-size="14" fill="#92400e">172.16.10.0/24 · gw .1</text>
  <rect x="64" y="672" width="332" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="230" y="699" text-anchor="middle" font-size="14" fill="#1f2937">SRV-WEB .10 (DVWA / API) — 443 público</text>
  <rect x="64" y="724" width="332" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="230" y="751" text-anchor="middle" font-size="14" fill="#1f2937">SRV-DNS .11</text>
  <rect x="64" y="776" width="332" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="230" y="803" text-anchor="middle" font-size="14" fill="#1f2937">BROKER-IOT .20 (MQTT/TLS 8883)</text>

  <!-- INTERNA -->
  <rect x="510" y="600" width="380" height="250" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="700" y="632" text-anchor="middle" font-size="20" font-weight="bold" fill="#065f46">VLAN 20 · RED INTERNA</text>
  <text x="700" y="654" text-anchor="middle" font-size="14" fill="#065f46">172.16.20.0/24 · gw .1 · DHCP</text>
  <rect x="534" y="672" width="332" height="44" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="700" y="699" text-anchor="middle" font-size="14" fill="#1f2937">SRV-ARCHIVOS .10 (SMB 445)</text>
  <rect x="534" y="724" width="332" height="44" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="700" y="751" text-anchor="middle" font-size="14" fill="#1f2937">PC-ADMIN .50 (única que administra)</text>
  <rect x="534" y="776" width="332" height="44" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="700" y="803" text-anchor="middle" font-size="14" fill="#1f2937">PC-01 · PC-02 (usuarios)</text>

  <!-- IoT -->
  <rect x="980" y="600" width="380" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="1170" y="632" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e40af">VLAN 30 · IoT</text>
  <text x="1170" y="654" text-anchor="middle" font-size="14" fill="#1e40af">172.16.30.0/24 · gw .1 · sin Internet</text>
  <rect x="1004" y="672" width="332" height="44" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="1170" y="699" text-anchor="middle" font-size="14" fill="#1f2937">CAM-01 (cámara IP)</text>
  <rect x="1004" y="724" width="332" height="44" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="1170" y="751" text-anchor="middle" font-size="14" fill="#1f2937">SENSOR-01 (humo)</text>
  <rect x="1004" y="776" width="332" height="44" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="1170" y="803" text-anchor="middle" font-size="14" fill="#1f2937">TERMOSTATO-01</text>

  <!-- Flows -->
  <!-- allowed INTERNA -> DMZ web -->
  <line x1="510" y1="690" x2="400" y2="690" stroke="#1a7f37" stroke-width="3" marker-end="url(#ok)"/>
  <text x="455" y="682" text-anchor="middle" font-size="12" fill="#1a7f37">443</text>
  <!-- blocked DMZ -> INTERNA -->
  <line x1="420" y1="760" x2="506" y2="760" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <text x="463" y="752" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">✕</text>
  <!-- blocked IoT -> INTERNA -->
  <line x1="980" y1="760" x2="894" y2="760" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <text x="937" y="752" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">✕</text>
  <!-- allowed IoT -> broker (curve below) -->
  <path d="M1170,850 C1170,930 230,930 230,824" fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#ok)"/>
  <text x="700" y="945" text-anchor="middle" font-size="13" fill="#1a7f37">IoT → solo BROKER-IOT:8883 y DNS (única salida permitida)</text>

  <!-- Legend -->
  <rect x="40" y="420" width="400" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="58" y="446" font-size="15" font-weight="bold" fill="#111827">Leyenda</text>
  <line x1="58" y1="468" x2="118" y2="468" stroke="#1a7f37" stroke-width="3" marker-end="url(#ok)"/>
  <text x="128" y="473" font-size="13" fill="#111827">Flujo permitido (regla Pass explícita)</text>
  <line x1="58" y1="494" x2="118" y2="494" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#no)"/>
  <text x="128" y="499" font-size="13" fill="#111827">Bloqueado con log (deny / Block)</text>
  <line x1="58" y1="520" x2="118" y2="520" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#vpn)"/>
  <text x="128" y="525" font-size="13" fill="#111827">Túnel VPN IPsec (cifrado)</text>

  <rect x="960" y="420" width="400" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="978" y="446" font-size="15" font-weight="bold" fill="#111827">VLAN 99 GESTIÓN · 172.16.99.0/24</text>
  <text x="978" y="470" font-size="13" fill="#111827">Nativa de la troncal (no la VLAN 1)</text>
  <text x="978" y="492" font-size="13" fill="#111827">SSH a equipos solo desde PC-ADMIN</text>
  <text x="978" y="514" font-size="13" fill="#111827">VLAN 999: puertos sin uso apagados</text>

  <text x="700" y="970" text-anchor="middle" font-size="13" fill="#6b7280">Deny implícito al final de cada ACL: lo que no está permitido explícitamente se bloquea y registra.</text>
</svg>
