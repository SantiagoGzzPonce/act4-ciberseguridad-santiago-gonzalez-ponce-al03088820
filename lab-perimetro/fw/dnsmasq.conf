# DNS Resolver de pfSense + DNSBL de pfBlockerNG (equivalente con dnsmasq)
no-resolv
no-hosts
bind-interfaces
listen-address=172.16.10.1,172.16.20.1,172.16.30.1
log-queries=extra
log-facility=/var/log/dnsmasq.log
# Zona local
host-record=www.act4.local,172.16.10.10
host-record=broker.act4.local,172.16.10.20
# Reenvio del resto al "Internet" del laboratorio
server=198.51.100.53
# Las lineas address=/dominio/10.10.10.1 (VIP de DNSBL) las genera entrypoint.sh
conf-file=/etc/dnsmasq.d/dnsbl-phishing.conf
