# snort.conf del sensor en la WAN del firewall perimetral (como Snort en la WAN de pfSense).
ipvar HOME_NET [198.51.100.2/32,172.16.10.0/24]
ipvar EXTERNAL_NET !$HOME_NET
portvar HTTP_PORTS [80,443,8080]
var RULE_PATH /etc/snort/act4/rules
include /etc/snort/classification.config
include /etc/snort/reference.config
config logdir: /var/log/snort
# veth de contenedores no calcula checksums
config checksum_mode: none
config disable_decode_alerts
dynamicpreprocessor directory /usr/lib/snort/snort_dynamicpreprocessor/
dynamicengine /usr/lib/snort/snort_dynamicengine/libsf_engine.so
preprocessor frag3_global
preprocessor frag3_engine: policy linux
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy linux, ports both 80
preprocessor stream5_udp
preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252
preprocessor http_inspect_server: server default profile all ports { 80 }
# Detector de escaneos integrado (complementa las reglas propias)
preprocessor sfportscan: proto { all } scan_type { all } sense_level { medium } memcap { 10000000 } logfile { portscan.log }
output alert_fast: alert.fast
include $RULE_PATH/act4-portscan.rules
